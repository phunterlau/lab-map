<script>
const NODE_DATA = {"Q-0001": {"type": "goal", "title": "Persistent research memory", "summary": "How should evolving research decisions survive across sessions and agents?", "status": "exploring", "confidence": null, "edges": [{"direction": "->", "type": "EXPLORES", "other": "O-0002", "reason": null}, {"direction": "->", "type": "EXPLORES", "other": "O-0003", "reason": null}, {"direction": "->", "type": "EXPLORES", "other": "O-0004", "reason": null}], "provenance": [{"session_id": "01a0aaaa-0000-7000-8000-000000000001", "turn_id": "t-0001", "byte_start": 1105, "byte_end": 1584, "excerpt": "We need persistent research memory so we stop losing track of why we rejected an approach across sessions. What are our options for storing the evolving research/decision state?"}]}, "O-0002": {"type": "option", "title": "Graphiti (temporal knowledge graph)", "summary": "Native time-varying edges, but needs a continuously running service.", "status": "dormant", "confidence": null, "edges": [{"direction": "<-", "type": "EXPLORES", "other": "Q-0001", "reason": null}, {"direction": "<-", "type": "REJECTED_BECAUSE", "other": "D-0005", "reason": "operationally heavy for current scale"}, {"direction": "<-", "type": "REVISIT_WHEN", "other": "R-0006", "reason": null}], "provenance": [{"session_id": "01a0aaaa-0000-7000-8000-000000000001", "turn_id": "t-0001", "byte_start": 1105, "byte_end": 1584, "excerpt": "We need persistent research memory so we stop losing track of why we rejected an approach across sessions. What are our options for storing the evolving research/decision state?"}]}, "O-0003": {"type": "option", "title": "Markdown + MCP", "summary": "Zero-infra, human-readable; weaker at representing how a decision changed over time.", "status": "chosen", "confidence": null, "edges": [{"direction": "<-", "type": "EXPLORES", "other": "Q-0001", "reason": null}, {"direction": "<-", "type": "CHOSEN_OVER", "other": "D-0005", "reason": null}], "provenance": [{"session_id": "01a0aaaa-0000-7000-8000-000000000001", "turn_id": "t-0001", "byte_start": 1105, "byte_end": 1584, "excerpt": "We need persistent research memory so we stop losing track of why we rejected an approach across sessions. What are our options for storing the evolving research/decision state?"}]}, "O-0004": {"type": "option", "title": "Postgres-backed decision graph", "summary": "Most flexible querying; a server + migrations for a single-person project.", "status": "dormant", "confidence": null, "edges": [{"direction": "<-", "type": "EXPLORES", "other": "Q-0001", "reason": null}], "provenance": [{"session_id": "01a0aaaa-0000-7000-8000-000000000001", "turn_id": "t-0001", "byte_start": 1105, "byte_end": 1584, "excerpt": "We need persistent research memory so we stop losing track of why we rejected an approach across sessions. What are our options for storing the evolving research/decision state?"}]}, "D-0005": {"type": "decision", "title": "Prototype Markdown + MCP first", "summary": "Cheap to build and throw away; keep Graphiti as a documented fallback.", "status": "chosen", "confidence": null, "edges": [{"direction": "->", "type": "CHOSEN_OVER", "other": "O-0003", "reason": null}, {"direction": "->", "type": "REJECTED_BECAUSE", "other": "O-0002", "reason": "operationally heavy for current scale"}], "provenance": [{"session_id": "01a0aaaa-0000-7000-8000-000000000001", "turn_id": "t-0001", "byte_start": 1105, "byte_end": 1584, "excerpt": "We need persistent research memory so we stop losing track of why we rejected an approach across sessions. What are our options for storing the evolving research/decision state?"}]}, "R-0006": {"type": "revisit_condition", "title": "Reconsider Graphiti", "summary": "If temporal/versioned queries become central to how the graph is used.", "status": "open", "confidence": null, "edges": [{"direction": "->", "type": "REVISIT_WHEN", "other": "O-0002", "reason": null}], "provenance": [{"session_id": "01a0aaaa-0000-7000-8000-000000000001", "turn_id": "t-0001", "byte_start": 1105, "byte_end": 1584, "excerpt": "We need persistent research memory so we stop losing track of why we rejected an approach across sessions. What are our options for storing the evolving research/decision state?"}]}};
const STATUS_COLOR = {"chosen": "#2e7d32", "rejected": "#c62828", "dormant": "#9e9e9e", "completed": "#1565c0", "exploring": "#f9a825", "open": "#f9a825", "candidate": "#6a1b9a", "blocked": "#c62828", "superseded": "#9e9e9e"};

const viewport = document.getElementById('viewport');
const canvas = document.getElementById('canvas');
let scale = 1, tx = 0, ty = 0, dragging = false, lastX = 0, lastY = 0;

function applyTransform() {
  canvas.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
}

viewport.addEventListener('wheel', function (e) {
  e.preventDefault();
  const delta = -e.deltaY * 0.001;
  const newScale = Math.min(4, Math.max(0.1, scale * (1 + delta)));
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  tx = cx - (cx - tx) * (newScale / scale);
  ty = cy - (cy - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, { passive: false });

viewport.addEventListener('mousedown', function (e) {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', function (e) {
  if (!dragging) return;
  tx += e.clientX - lastX;
  ty += e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', function () {
  dragging = false;
  viewport.classList.remove('dragging');
});

applyTransform();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderPanel(nodeId) {
  const d = NODE_DATA[nodeId];
  const panel = document.getElementById('panel');
  if (!d) { panel.innerHTML = '<div class="hint">No data for ' + escapeHtml(nodeId) + '</div>'; return; }
  const color = STATUS_COLOR[d.status] || '#888';
  let html = '<h2>' + escapeHtml(nodeId) + '</h2>';
  html += '<div><span class="badge" style="background:' + color + '">' + escapeHtml(d.status) + '</span> ';
  html += '<span class="muted">' + escapeHtml(d.type) + (d.confidence != null ? ' &middot; confidence ' + d.confidence : '') + '</span></div>';
  html += '<p>' + escapeHtml(d.title) + '</p>';
  if (d.summary) html += '<p class="muted">' + escapeHtml(d.summary) + '</p>';
  if (d.edges.length) {
    html += '<h3>Edges</h3>';
    d.edges.forEach(function (e) {
      html += '<div class="edge-row">' + e.direction + ' <b>' + escapeHtml(e.type) + '</b> ' + escapeHtml(e.other);
      if (e.reason) html += '<br><span class="muted">' + escapeHtml(e.reason) + '</span>';
      html += '</div>';
    });
  }
  if (d.provenance.length) {
    html += '<h3>Provenance</h3>';
    d.provenance.forEach(function (p) {
      html += '<div class="prov-row"><span class="muted">session ' + escapeHtml(p.session_id) + ' turn ' + escapeHtml(p.turn_id);
      html += '<br>bytes [' + p.byte_start + ':' + p.byte_end + ']</span><br>' + escapeHtml(p.excerpt) + '</div>';
    });
  }
  panel.innerHTML = html;
}

canvas.addEventListener('click', function (e) {
  const g = e.target.closest('g.node');
  if (!g) return;
  const title = g.querySelector('title');
  if (!title) return;
  renderPanel(title.textContent);
});
</script>
