[project]
name = "trace-mind"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Hongliang Liu", email = "phunter.lau@gmail.com" } 
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
trace-mind = "trace_mind:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
